<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airfare CSV Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .message {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Airfare CSV Data Viewer (clean_dataset.csv)</h1>
    
    <div class="table-container">
        <table id="csvTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="100%" class="message">Loading dataset...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('Clean_Dataset.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not find 'clean_dataset.csv' in the same folder.");
                }
                return response.text();
            })
            .then(text => {
                const lines = text.split(/\r\n|\n/);
                const headerRow = document.getElementById('tableHeader');
                const tableBody = document.getElementById('tableBody');

                headerRow.innerHTML = '';
                tableBody.innerHTML = '';

                if (lines.length === 0 || !lines[0].trim()) {
                    tableBody.innerHTML = '<tr><td colspan="100%" class="message error">The CSV file is empty.</td></tr>';
                    return;
                }

                // Parse header columns
                const headers = parseCSVLine(lines[0]);
                headers.forEach(header => {
                    const th = document.createElement('th');
                    th.textContent = header.replace(/^["']|["']$/g, '').trim();
                    headerRow.appendChild(th);
                });

                // Parse rows (capped at first 1000 rows for smooth performance)
                const maxRows = Math.min(lines.length, 1000);
                let rowCount = 0;

                for (let i = 1; i < maxRows; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const values = parseCSVLine(line);
                    const tr = document.createElement('tr');

                    headers.forEach((_, index) => {
                        const td = document.createElement('td');
                        td.textContent = values[index] !== undefined ? values[index].replace(/^["']|["']$/g, '').trim() : '';
                        tr.appendChild(td);
                    });

                    tableBody.appendChild(tr);
                    rowCount++;
                }

                if (rowCount === 0) {
                    tableBody.innerHTML = '<tr><td colspan="100%" class="message error">No valid rows found in the CSV file.</td></tr>';
                }
            })
            .catch(err => {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="100%" class="message error">${err.message} (Make sure you are running a local server)</td></tr>`;
            });
    });

    // Utility to handle commas inside quoted CSV strings
    function parseCSVLine(text) {
        const result = [];
        let current = '';
        let inQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"' || char === "'") {
                inQuotes = !inQuotes;
                current += char;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }
</script>

</body>
</html>
