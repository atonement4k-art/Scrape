<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airfare Price Dashboard – 3 Routes × 5 Windows</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--background);
            color: var(--text-main);
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 8px;
        }
        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .matrix-table th, .matrix-table td {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .matrix-table th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
        }
        .matrix-table tbody tr:hover {
            background-color: #f1f5f9;
        }
        .clickable-cell {
            cursor: pointer;
            transition: background 0.2s;
        }
        .clickable-cell:hover {
            background-color: #dbeafe;
        }
        .avg-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }
        .sample-size {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
        }
        .detail-section {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .detail-section h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .detail-table {
            width: 100%;
            border-collapse: collapse;
        }
        .detail-table th, .detail-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .detail-table th {
            background-color: #f1f5f9;
            color: var(--text-main);
            font-weight: 600;
        }
        .error-message {
            color: var(--accent-red);
            font-weight: 600;
        }
        .loading {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Airfare Price Dashboard</h1>
            <p>3 High‑Traffic Routes × 5 Advance Purchase Windows</p>
        </header>

        <!-- Matrix Table -->
        <table class="matrix-table" id="matrixTable">
            <thead>
                <tr>
                    <th>Route</th>
                    <th>T+1</th>
                    <th>T+7</th>
                    <th>T+15</th>
                    <th>T+30</th>
                    <th>T+45</th>
                </tr>
            </thead>
            <tbody id="matrixBody">
                <tr>
                    <td colspan="6" class="loading">Loading data…</td>
                </tr>
            </tbody>
        </table>

        <!-- Detail Section (hidden until cell click) -->
        <div class="detail-section" id="detailSection" style="display: none;">
            <h2 id="detailTitle"></h2>
            <table class="detail-table" id="detailTable">
                <thead>
                    <tr>
                        <th>Airline</th>
                        <th>Flight No.</th>
                        <th>Departure</th>
                        <th>Total Fare (₹)</th>
                        <th>Base Fare (₹)</th>
                    </tr>
                </thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const routes = ['DEL-BOM', 'BOM-BLR', 'DEL-BLR'];
        const windows = ['T+1', 'T+7', 'T+15', 'T+30', 'T+45'];

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadAllData() {
            const dataCache = {}; // key: "route_window", value: array of flights
            const averageCache = {}; // key: "route_window", value: {avg, count}

            const fetchPromises = [];
            routes.forEach(route => {
                windows.forEach(window => {
                    const fileName = `${route}_${window}.json`;
                    const key = `${route}_${window}`;
                    fetchPromises.push(
                        fetch(fileName)
                            .then(response => {
                                if (!response.ok) throw new Error(`File not found: ${fileName}`);
                                return response.json();
                            })
                            .then(data => {
                                dataCache[key] = data;
                                if (Array.isArray(data) && data.length > 0) {
                                    const totalFares = data.map(f => f.total_fare).filter(v => v !== undefined);
                                    const avg = totalFares.reduce((a, b) => a + b, 0) / totalFares.length;
                                    averageCache[key] = { avg: avg, count: data.length };
                                } else {
                                    averageCache[key] = { avg: 0, count: 0 };
                                }
                            })
                            .catch(error => {
                                console.warn(error.message);
                                averageCache[key] = { avg: null, count: 0 };
                                dataCache[key] = [];
                            })
                    );
                });
            });

            await Promise.all(fetchPromises);
            return { dataCache, averageCache };
        }

        // ============================================
        // RENDER MATRIX
        // ============================================
        function renderMatrix(averageCache) {
            const tbody = document.getElementById('matrixBody');
            tbody.innerHTML = '';
            routes.forEach(route => {
                const tr = document.createElement('tr');
                const routeCell = document.createElement('td');
                routeCell.textContent = route;
                routeCell.style.fontWeight = 'bold';
                tr.appendChild(routeCell);

                windows.forEach(window => {
                    const key = `${route}_${window}`;
                    const info = averageCache[key];
                    const td = document.createElement('td');
                    td.className = 'clickable-cell';
                    if (info && info.avg !== null) {
                        td.innerHTML = `<span class="avg-price">₹${info.avg.toFixed(0)}</span>
                                        <span class="sample-size">${info.count} flights</span>`;
                        td.addEventListener('click', () => showDetails(route, window, dataCache[key]));
                    } else {
                        td.innerHTML = `<span class="error-message">Data not available</span>`;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // ============================================
        // SHOW DETAILS ON CLICK
        // ============================================
        function showDetails(route, window, flights) {
            const detailSection = document.getElementById('detailSection');
            const detailTitle = document.getElementById('detailTitle');
            const detailBody = document.getElementById('detailBody');

            detailTitle.textContent = `${route} – ${window} Window (${flights.length} flights)`;
            detailBody.innerHTML = '';

            if (flights.length === 0) {
                detailBody.innerHTML = '<tr><td colspan="5" class="error-message">No flight data available.</td></tr>';
            } else {
                flights.forEach(f => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${f.airline || 'N/A'}</td>
                        <td>${f.flight_no || 'N/A'}</td>
                        <td>${f.departure_time || 'N/A'}</td>
                        <td>₹${f.total_fare ? f.total_fare.toLocaleString() : 'N/A'}</td>
                        <td>₹${f.base_fare ? f.base_fare.toLocaleString() : 'N/A'}</td>
                    `;
                    detailBody.appendChild(tr);
                });
            }
            detailSection.style.display = 'block';
            detailSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================
        // INIT
        // ============================================
        let dataCache; // store globally for detail view

        async function init() {
            const result = await loadAllData();
            dataCache = result.dataCache;
            renderMatrix(result.averageCache);
        }

        init();
    </script>
</body>
</html>
